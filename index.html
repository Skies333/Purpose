<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0e09">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="purpose">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>purpose · Treino em Casa e Ginásio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: coluna de app mobile centrada, navegação inferior flutuante; superfícies escuras, lima só para ação e estado */
  --bg:#0c0e09; --surface:#161911; --surface2:#1f2318; --line:#2b3023;
  --ink:#f1f4e8; --muted:#97a084; --lime:#d6f53d; --lime-ink:#141900; --danger:#ff7a6b;
  --fg:#d6f53d; --fg2:#5f6d1f;
  --display:"Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --body:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:22px;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(900px 500px at 85% -10%, rgba(214,245,61,.08), transparent 60%)}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.08;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:32px;font-weight:800}
h2{font-size:26px;font-weight:800}
h3{font-size:17px;font-weight:600}
.muted{color:var(--muted)} .small{font-size:13px} .center{text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--lime)}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--lime-ink);background:var(--lime);padding:3px 9px;border-radius:99px}

.app{max-width:560px;margin:0 auto;padding:0 16px 120px}
#main{display:flex;flex-direction:column;gap:18px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-top:28px}
.top p{margin-top:6px;max-width:42ch}
.streak{display:flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--line);padding:9px 14px;border-radius:99px;color:var(--lime)}
.streak b{font-family:var(--display);font-size:18px;color:var(--ink)}

/* figuras */
.fig{width:100%;height:100%;display:block;overflow:visible}
.f-floor{stroke:currentColor;opacity:.18;stroke-width:1.5}
.f-shadow{fill:#000;opacity:.35}
.f-prop{fill:#2c3222;stroke:#3d4530;stroke-width:1}
.f-near polyline,.f-body polyline{stroke:var(--fg);stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
.f-far polyline{stroke:var(--fg2);stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
.f-head{fill:var(--fg)}
.on-lime{--fg:#141900;--fg2:rgba(20,25,0,.4)}
.on-lime .f-prop{fill:rgba(20,25,0,.15);stroke:none}

/* hoje */
.today{position:relative;border-radius:28px;overflow:hidden;background:linear-gradient(160deg,#20251a,#12150e);border:1px solid var(--line);display:grid}
.today-fig{height:190px;background:radial-gradient(60% 80% at 50% 70%, rgba(214,245,61,.14), transparent 70%);color:var(--ink)}
.today-txt{padding:4px 20px 20px;display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;background:rgba(255,255,255,.06);border:1px solid var(--line);padding:5px 11px;border-radius:99px}
.chips .ic{width:15px;height:15px;color:var(--lime)}
.done-note{display:flex;gap:8px;align-items:center;color:var(--lime);font-weight:600;font-size:14px}
.row-btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;padding:14px 22px;border-radius:99px;min-height:50px;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.lime{background:var(--lime);color:var(--lime-ink)}
.btn.ghost{border:1.5px solid var(--line);background:var(--surface)}
.btn.dark{background:var(--lime-ink);color:var(--lime)}
.btn.full{width:100%}
.btn.sm{min-height:42px;padding:8px 18px}
.btn .ic{width:18px;height:18px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px}
.week{flex-direction:row;align-items:center;gap:18px}
.week-l{position:relative;flex:none}
.ring-bg{fill:none;stroke:var(--surface2);stroke-width:9}
.ring-fg{fill:none;stroke:var(--lime);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring-n{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;color:var(--muted)}
.ring-n b{font-family:var(--display);font-size:22px;color:var(--ink);display:contents}
.week-r{display:flex;flex-direction:column;gap:6px;min-width:0}
.dots{display:flex;gap:6px;margin-top:4px}
.dots span{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--surface2);color:var(--muted)}
.dots span.on{background:var(--lime);color:var(--lime-ink)}
.dots span.now{box-shadow:0 0 0 1.5px var(--lime) inset}

.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
.sec-h.in{margin:0}
.link{color:var(--lime);font-weight:600;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.link.danger{color:var(--danger);margin-top:6px}
.zones{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.zone{position:relative;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;text-align:left}
.zfig{height:92px;background:radial-gradient(70% 90% at 50% 85%, rgba(214,245,61,.13), transparent 70%),var(--surface2);color:var(--ink);transition:background .3s}
.ztxt{padding:10px 14px 12px;display:flex;flex-direction:column;min-width:0}
.ztxt b{font-family:var(--display);font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ztxt small{color:var(--muted);font-size:12.5px}
.zgo{position:absolute;right:10px;bottom:12px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);color:var(--muted);transition:background .2s,color .2s,transform .2s}
.zgo .ic{width:16px;height:16px}
.zone:hover{border-color:#4a5236}
.zone:hover .zgo{background:var(--lime);color:var(--lime-ink);transform:translateX(2px)}
.zone:hover .zfig{background:radial-gradient(70% 90% at 50% 85%, rgba(214,245,61,.22), transparent 70%),var(--surface2)}

.hscroll{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scroll-snap-type:x mandatory;scrollbar-width:none}
.hscroll .wcard{flex:0 0 200px;scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.wcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:border-color .15s}
.wcard:hover{border-color:#4a5236}
.wfig{height:120px;background:radial-gradient(70% 90% at 50% 80%, rgba(214,245,61,.12), transparent 70%),var(--surface2);color:var(--ink)}
.wmeta{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.wmeta b{font-family:var(--display);font-size:17px;line-height:1.15;font-weight:600}
.wmeta small{color:var(--muted);font-size:12.5px}
.tipcard{flex-direction:row;align-items:center;justify-content:space-between;text-align:left;background:linear-gradient(135deg,#232a12,var(--surface))}
.chev{color:var(--muted)}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px}
.seg button{padding:10px;border-radius:99px;font-weight:600;font-size:14px;text-align:center;color:var(--muted)}
.seg button.on{background:var(--lime);color:var(--lime-ink)}
.chipbar{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none}
.chip{flex:none;padding:8px 14px;border-radius:12px;border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--muted);background:var(--surface)}
.chip.on{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}

.list{display:flex;flex-direction:column;gap:8px}
.exrow{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:8px 14px 8px 8px;width:100%}
.exrow>div:nth-child(2){flex:1;display:flex;flex-direction:column;min-width:0}
.exrow b{font-weight:700}
.exrow small{color:var(--muted);font-size:13px}
.exfig{width:84px;height:62px;border-radius:12px;overflow:hidden;background:var(--surface2);flex:none;color:var(--ink)}

.plan-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 12px 12px 16px;transition:border-color .2s,background .2s}
.plan-row:hover{border-color:#4a5236}
.plan-open{flex:1;display:flex;align-items:center;gap:14px;min-width:0;text-align:left;border-radius:12px}
.plan-open:hover .pinfo b{color:var(--lime)}
.pinfo b{transition:color .2s}
.p-more{font-size:12.5px;font-weight:700;color:var(--lime);margin-top:3px;white-space:nowrap;opacity:.85}
.plan-extra{flex-basis:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-left:58px;padding:10px 14px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-size:14px;font-weight:600;text-align:left;transition:border-color .2s}
.plan-extra small{color:var(--muted);font-size:12.5px;font-weight:500;white-space:nowrap}
.plan-extra:hover{border-color:var(--lime)}
.plan-row.now{border-color:var(--lime);background:linear-gradient(135deg,#232a12,var(--surface))}
.pday{width:44px;display:flex;flex-direction:column;align-items:flex-start}
.pday b{font-family:var(--display);font-size:18px}
.pday i{font-style:normal;font-size:11px;font-weight:700;color:var(--lime)}
.pinfo{flex:1;display:flex;flex-direction:column;min-width:0}
.pinfo small{color:var(--muted);font-size:13px}
.round-btn{width:46px;height:46px;border-radius:50%;background:var(--lime);color:var(--lime-ink);display:grid;place-items:center;flex:none}
.steps{padding-left:20px;display:flex;flex-direction:column;gap:8px}
.steps li::marker{color:var(--lime);font-weight:700}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.stat small{color:var(--muted);font-size:13px}
.stat b{display:block;font-family:var(--display);font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.stat b i{font-style:normal;font-size:14px;font-weight:600;color:var(--muted);font-family:var(--body)}
.heat{max-width:340px;display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:5px}
.heat span{aspect-ratio:1;border-radius:5px;background:var(--surface2)}
.heat span.on{background:var(--lime)}
.heat span.fut{opacity:.3}
.goal{flex-direction:row;align-items:center;justify-content:space-between}
.stepper{display:flex;align-items:center;gap:12px;background:var(--surface2);border-radius:99px;padding:4px}
.stepper button{width:38px;height:38px;border-radius:50%;background:var(--surface);font-size:20px;text-align:center}
.stepper b{font-family:var(--display);font-size:20px;min-width:18px;text-align:center}
.inline{display:flex;align-items:center;gap:10px}
.inline input{flex:1;min-width:0;background:var(--surface2);border:1px solid var(--line);color:var(--ink);font:600 18px var(--body);padding:10px 14px;border-radius:14px}
.inline span{color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:10px 0}
.spark{width:100%;height:90px}
.spark .grid{stroke:var(--line)} .spark .area{fill:rgba(214,245,61,.12)} .spark .lineg{fill:none;stroke:var(--lime);stroke-width:2.5;vector-effect:non-scaling-stroke}
.spark .dot{fill:var(--lime)}
.spark-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.spark-h b{font-family:var(--display);font-size:24px}
.spark-h .up{color:var(--lime);font-size:13px} .spark-h .down{color:var(--muted);font-size:13px}
.hist{display:flex;flex-direction:column}
.hrow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.hrow div{display:flex;flex-direction:column}
.hrow small{color:var(--muted);font-size:12.5px}
.hrow span{font-weight:700;color:var(--lime);font-variant-numeric:tabular-nums}

.vsel{width:100%;background:var(--surface2);border:1px solid var(--line);color:var(--ink);font:600 15px var(--body);padding:12px 14px;border-radius:14px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--lime) 50%),linear-gradient(135deg,var(--lime) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat}
.vsel:focus-visible{outline:2px solid var(--lime)}
.calc-out{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.calc-out div{background:var(--lime);color:var(--lime-ink);border-radius:16px;padding:12px}
.calc-out small{font-size:12px;font-weight:600;opacity:.75}
.calc-out b{display:block;font-family:var(--display);font-size:17px;white-space:nowrap;font-weight:800}
.tips{display:flex;flex-direction:column;gap:8px}
.tip{display:flex;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.tip-n{font-family:var(--display);font-weight:800;color:var(--lime);font-size:18px;line-height:1.2}
.tip p{color:var(--muted);font-size:14px;margin-top:3px;max-width:60ch}

/* navegação */
.nav{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(528px,calc(100% - 24px));display:grid;grid-template-columns:repeat(5,1fr);align-items:center;
  background:rgba(22,25,17,.62);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);box-shadow:0 10px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.05);border:1px solid var(--line);border-radius:26px;padding:8px;z-index:10}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0;border-radius:16px}
.nav button.on{color:var(--lime)}
.nav .fab{width:56px;height:56px;margin:-26px auto 0;border-radius:50%;background:var(--lime);color:var(--lime-ink);display:grid;place-items:center;box-shadow:0 8px 26px rgba(214,245,61,.3),0 0 0 6px var(--bg)}
.nav .fab .ic{width:26px;height:26px;stroke-width:2.6}

/* overlays */
.overlay{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto}
.sheet-in{max-width:560px;margin:0 auto;padding-bottom:110px}
.hero{position:relative;display:flex;flex-direction:column;overflow:hidden;color:var(--ink);padding-top:calc(64px + env(safe-area-inset-top))}
.hero-fig{position:relative;height:220px;margin:0 20px;border-radius:28px;overflow:hidden;background:radial-gradient(60% 75% at 50% 75%, rgba(214,245,61,.16), transparent 70%),linear-gradient(#1c2016,#13160f);border:1px solid var(--line)}
.icon-btn{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid var(--line);display:grid;place-items:center}
.icon-btn.off{opacity:.4}
.back{position:absolute;top:18px;left:20px}
.hero-txt{padding:18px 20px 4px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.hero-txt h2{font-size:30px}
.pad{padding:8px 20px;display:flex;flex-direction:column;gap:12px}
.pad>h3{margin-top:8px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.facts div{padding:12px;text-align:center;background:var(--surface)}
.facts div+div{border-left:1px solid var(--line)}
.facts small{color:var(--muted);font-size:12px}
.facts b{display:block;color:var(--lime);font-size:14px}
.sticky{position:fixed;left:0;right:0;bottom:0;padding:14px 20px 20px;background:linear-gradient(transparent,var(--bg) 40%);display:flex;justify-content:center}
.sticky .btn{max-width:520px}

#modal{background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center;z-index:40;overflow:hidden;overscroll-behavior:contain;touch-action:none}
#modal .modal-in{touch-action:pan-y}
body.mlock{overflow:hidden}
#modal[hidden],#confirm[hidden]{display:none}
.modal-in{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:28px 28px 0 0;width:100%;max-width:560px;padding:20px 20px 30px;display:flex;flex-direction:column;gap:10px;max-height:calc(100% - 20px - env(safe-area-inset-top));overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;align-items:flex-start}
.mclose{position:sticky;top:0;align-self:flex-end;margin:-4px -4px -46px 0;z-index:3;background:var(--surface2);box-shadow:0 4px 14px rgba(0,0,0,.35);flex:none}
.mfig{width:100%;height:230px;border-radius:20px;overflow:hidden;background:radial-gradient(60% 80% at 50% 75%, rgba(214,245,61,.14), transparent 70%),var(--surface2);color:var(--ink)}
.cues{padding-left:20px;display:flex;flex-direction:column;gap:6px}
.cues li::marker{color:var(--lime);font-weight:700}
.vars{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;margin-top:6px}
.vars div{background:var(--surface2);border-radius:14px;padding:12px}
.vars small{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.vars .hard small{color:var(--lime)}
.vars p{font-size:14px}

#confirm{background:rgba(6,8,4,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:grid;place-items:center;z-index:60;padding:20px}
.confirm-in{position:relative;width:100%;max-width:360px;background:linear-gradient(180deg,#1d2214,var(--surface) 55%);border:1px solid var(--line);border-radius:30px;padding:30px 22px 22px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.05);overflow:hidden}
.confirm-in::before{content:"";position:absolute;top:-80px;left:50%;width:220px;height:160px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(214,245,61,.22),transparent);pointer-events:none}
.confirm-in.danger::before{background:radial-gradient(closest-side,rgba(255,122,107,.22),transparent)}
.cf-icon{position:relative;width:64px;height:64px;border-radius:22px;display:grid;place-items:center;background:var(--lime);color:var(--lime-ink);box-shadow:0 10px 30px rgba(214,245,61,.3);margin-bottom:6px}
.cf-icon .ic{width:30px;height:30px;stroke-width:2.2}
.danger .cf-icon{background:rgba(255,122,107,.14);color:var(--danger);box-shadow:none;border:1px solid rgba(255,122,107,.3)}
.confirm-in h3{font-size:24px;font-weight:800}
.confirm-in p{color:var(--muted);font-size:14.5px;max-width:30ch}
.cf-prog{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;margin-top:4px}
.cf-prog-h{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.cf-prog-h b{color:var(--lime);font-variant-numeric:tabular-nums}
.cf-btns{width:100%;display:flex;flex-direction:column;gap:8px;margin-top:10px}
.cf-btns .btn{width:100%;min-height:52px}
.cf-yes{background:var(--lime);color:var(--lime-ink)}
.cf-yes:hover{box-shadow:0 8px 24px rgba(214,245,61,.28)}
.cf-no{color:var(--muted);background:transparent;border:1.5px solid var(--line)}
.cf-no:hover{color:var(--ink);border-color:#4a5236}
.danger .cf-yes{background:var(--danger);color:#2a0905}
.danger .cf-yes:hover{box-shadow:0 8px 24px rgba(255,122,107,.3)}
#confirm:not([hidden]) .cf-icon{animation:boxPop .5s .1s cubic-bezier(.2,.9,.3,1.4) both}

/* player */
#player{z-index:30}
.pl-in{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:16px 20px 24px;gap:14px}
.pl-top{display:flex;align-items:center;gap:12px}
.pl-title{flex:1;display:flex;flex-direction:column;min-width:0}
.pl-title small{color:var(--muted);font-size:12.5px}
.pl-tog{display:flex;gap:8px}
.pl-prog{display:flex;gap:3px}
.pl-prog span{flex:1;height:4px;border-radius:2px;background:var(--surface2)}
.pl-prog span.d{background:var(--lime)} .pl-prog span.c{background:var(--lime);opacity:.45}
.pl-stage{height:min(42vh,320px);border-radius:26px;overflow:hidden;background:radial-gradient(60% 80% at 50% 75%, rgba(214,245,61,.16), transparent 70%),var(--surface);border:1px solid var(--line);color:var(--ink)}
.pl-info{display:flex;flex-direction:column;gap:6px}
.pl-big{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.pl-big span#pl-num{font-family:var(--display);font-weight:800;font-size:78px;line-height:1;color:var(--lime);font-variant-numeric:tabular-nums}
.pl-big small{color:var(--muted);font-size:14px}
.pl-bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.pl-bar i{display:block;height:100%;width:calc(var(--p)*100%);background:var(--lime);transition:width .2s linear}
.pl-bar.dark{background:rgba(20,25,0,.15)} .pl-bar.dark i{background:var(--lime-ink)}
.pl-cue{color:var(--muted);font-size:14px}
.pl-ctrl{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:auto}
.skip{align-self:center;color:var(--muted)}
.rest-box{background:var(--lime);color:var(--lime-ink);border-radius:30px;padding:26px 22px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.rest-box .eyebrow{color:var(--lime-ink);opacity:.7}
.rest-num{font-family:var(--display);font-weight:800;font-size:120px;line-height:.9;font-variant-numeric:tabular-nums}
.rest-box .pl-bar{width:100%}
.rest-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.rest-btns .btn{min-height:44px;padding:10px 18px}
.up-next{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:10px 16px 10px 10px}
.up-next>div:nth-child(2){flex:1;display:flex;flex-direction:column}
.up-next small{color:var(--muted);font-size:12px}
.up-next span{color:var(--lime);font-size:13px;font-weight:600}
.fin{justify-content:center}
.fin-card{background:var(--lime);color:var(--lime-ink);border-radius:32px;padding:34px 24px 24px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.fin-check{width:96px;height:96px;border-radius:50%;background:var(--lime-ink);color:var(--lime);display:grid;place-items:center;box-shadow:0 0 0 12px rgba(20,25,0,.1)}
.fin-check .ic{width:48px;height:48px;stroke-width:3}
.fin-card h2{font-size:38px}
.fin-stats{display:grid;grid-template-columns:repeat(3,1fr);width:100%;gap:8px;margin:6px 0}
.fin-stats div{background:rgba(20,25,0,.08);border-radius:16px;padding:12px 6px}
.fin-stats b{display:block;font-family:var(--display);font-size:26px;font-weight:800}
.fin-stats small{font-size:12px;font-weight:600}

/* toggles */
.toggles{display:flex;flex-direction:column;gap:8px}
.tg{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer}
.tg input{position:absolute;opacity:0;width:1px;height:1px}
.tg .sw{width:44px;height:26px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);position:relative;flex:none;transition:background .15s}
.tg .sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.tg input:checked+.sw{background:var(--lime);border-color:var(--lime)}
.tg input:checked+.sw::after{transform:translateX(18px);background:var(--lime-ink)}
.tg input:focus-visible+.sw{outline:2px solid var(--lime);outline-offset:2px}
.tg div{display:flex;flex-direction:column}
.tg small{color:var(--muted);font-size:13px}
.pl-prog span.ph{opacity:.35}
.pl-prog span.ph.d{opacity:.6}
/* medalhas */
.medal{position:relative;width:64px;height:64px;display:grid;place-items:center;flex:none}
.medal svg{position:absolute;inset:0;width:100%;height:100%}
.m-hex{fill:var(--surface2);stroke:var(--line);stroke-width:2}
.medal .ic{position:relative;width:26px;height:26px;color:var(--muted)}
.medal.on .m-hex{fill:var(--lime);stroke:#eaff8a}
.medal.on .ic{color:var(--lime-ink);stroke-width:2.4}
.medal.on{filter:drop-shadow(0 4px 14px rgba(214,245,61,.25))}
.medal.sm{width:40px;height:40px}.medal.sm .ic{width:17px;height:17px}
.ach-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ach{background:var(--surface2);border-radius:16px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.ach b{font-size:13px;line-height:1.2;margin-top:4px}
.ach small{font-size:11px;color:var(--muted);line-height:1.3}
.ach:not(.on) b{color:var(--muted)}
.ach .ok{font-size:11px;font-weight:700;color:var(--lime);margin-top:auto}
.ach .pc{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.ach .mini-bar{margin-top:auto}
.mini-bar{width:100%;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.mini-bar i{display:block;height:100%;background:var(--lime);border-radius:3px}
.achcard{flex-direction:row;align-items:center;gap:14px;text-align:left}
.ach-medals{display:flex}
.ach-medals .medal+.medal{margin-left:-10px}
.ach-txt{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
.ach-txt small{color:var(--muted);font-size:13px}
.newach{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:10px}
.na{display:flex;align-items:center;gap:12px}
.na div{display:flex;flex-direction:column}.na small{color:var(--muted);font-size:13px}
.fin{overflow-y:auto}

/* modo casa/ginásio */
.mode{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:5px}
.mode button{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:11px;border-radius:14px;font-weight:700;font-size:14.5px;color:var(--muted);transition:color .3s}
.mode button.on{color:var(--lime-ink)}
.mode-ind{position:absolute;top:5px;bottom:5px;left:5px;width:calc(50% - 5px);border-radius:14px;background:var(--lime);box-shadow:0 6px 18px rgba(214,245,61,.25);transition:transform .4s cubic-bezier(.3,1.3,.5,1)}
.mode-ind.r{transform:translateX(100%)}
/* equipamento nos bonecos */
.fig{--eq:#e9eedc;--eq2:#8b937b}
.on-lime .fig{--eq:#141900;--eq2:rgba(20,25,0,.45)}
.f-prop-l{stroke:#343a29;stroke-linecap:round}
.on-lime .f-prop-l{stroke:rgba(20,25,0,.18)}
.f-plate{fill:var(--eq);stroke:#0c0e09;stroke-width:2}
.f-plate.dim{fill:var(--eq2)}
.f-hub{fill:#0c0e09}
.f-cable{stroke:var(--eq2);stroke-width:1.6}
.f-pulley{fill:#3d4530}
.f-bar{stroke:var(--eq);stroke-width:3;stroke-linecap:round}
.f-bar.thick{stroke:var(--eq2);stroke-width:7}
.f-platel{stroke:var(--eq);stroke-width:7;stroke-linecap:round}
/* séries e carga */
.setdots{display:flex;align-items:center;gap:6px}
.setdots span{width:22px;height:6px;border-radius:3px;background:var(--surface2)}
.setdots span.d{background:var(--lime)}
.setdots span.c{background:var(--lime);opacity:.5}
.setdots small{color:var(--muted);font-size:13px;margin-left:6px}
.loadbox{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:10px;margin-top:4px}
.ld-btn{width:48px;height:48px;border-radius:14px;background:var(--surface2);font-size:24px;font-weight:600;text-align:center;flex:none;transition:transform .12s,background .2s}
.ld-btn:hover{background:#2a3020}
.ld-btn:active{transform:scale(.92)}
.ld-v{flex:1;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:center;column-gap:5px;text-align:center}
.ld-v b{font-family:var(--display);font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;display:inline-block}
.ld-v input{width:3.6em;background:transparent;border:0;border-bottom:2px dashed #3a4130;color:var(--ink);font-family:var(--display);font-size:30px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;padding:0 2px;border-radius:0}
.ld-v input:focus{outline:none;border-bottom-color:var(--lime)}
.ld-v input::placeholder{color:#4a5236}
.ex-load{flex-wrap:wrap}
.sm-link{font-size:13px;margin-left:auto}
.ld-v span{color:var(--muted);font-weight:600}
.ld-v small{flex-basis:100%;color:var(--muted);font-size:12px}
.fin-pr{display:flex;align-items:center;gap:10px;background:var(--lime-ink);color:var(--lime);border-radius:16px;padding:10px 14px;font-size:13.5px;font-weight:600;text-align:left;width:100%}
.ex-load{display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:12px;padding:8px 12px;font-size:13.5px;color:var(--muted)}
.ex-load b{color:var(--lime)}

.pl-time{display:inline-flex;align-items:center;gap:6px;margin-left:auto;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 12px;color:var(--lime)}
.pl-time b{font-family:var(--display);font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink)}
.pl-time .ic{width:16px;height:16px}
.pl-hint{color:var(--muted);font-size:12.5px}
.pl-hint b{color:var(--ink)}
.pl-ctrl .span2{grid-column:1/-1;min-height:44px}
/* áreas seguras (iPhone com notch / modo ecrã inteiro) */
.app{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));padding-bottom:calc(120px + env(safe-area-inset-bottom))}
.top{padding-top:calc(28px + env(safe-area-inset-top))}
.nav{bottom:calc(14px + env(safe-area-inset-bottom))}
.pl-in{padding-top:calc(16px + env(safe-area-inset-top));padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.back{top:calc(18px + env(safe-area-inset-top))}
.sticky{padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.modal-in{padding-bottom:calc(30px + env(safe-area-inset-bottom))}
html{-webkit-tap-highlight-color:transparent}
/* lista de vozes */
.vlist{display:flex;flex-direction:column;gap:6px}
.vrow{display:flex;align-items:center;gap:6px;background:var(--surface2);border:1.5px solid transparent;border-radius:16px;padding:4px 6px 4px 4px;transition:border-color .2s,background .2s}
.vrow:hover{background:#262b1d}
.vrow.on{border-color:var(--lime);background:linear-gradient(135deg,rgba(214,245,61,.10),var(--surface2))}
.vpick{flex:1;display:flex;align-items:center;gap:12px;padding:8px 6px;border-radius:12px;min-width:0}
.vradio{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;transition:all .2s}
.vradio .ic{width:14px;height:14px;stroke-width:3;opacity:0;transform:scale(.5);transition:all .2s}
.vrow.on .vradio{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.vrow.on .vradio .ic{opacity:1;transform:none}
.vinfo{display:flex;flex-direction:column;gap:4px;min-width:0}
.vinfo b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vtags{display:flex;gap:5px;flex-wrap:wrap}
.vtags i{font-style:normal;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.vtags .vnat{background:rgba(214,245,61,.14);color:var(--lime);border-color:rgba(214,245,61,.3)}
.vprev{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--lime);flex:none;transition:transform .15s,background .2s}
.vprev .ic{width:16px;height:16px}
.vprev:hover{background:var(--lime);color:var(--lime-ink)}
.vprev.playing{background:var(--lime);color:var(--lime-ink);animation:halo 1s ease-out infinite}
/* logo */
.logo{display:inline-flex;align-items:baseline;font-family:var(--display);font-weight:800;font-variation-settings:'opsz' 96;letter-spacing:-.05em;line-height:1;color:var(--ink);font-size:30px;white-space:nowrap}
.logo-o{display:inline-block;position:relative;width:.54em;height:.54em;margin:0 .03em;align-self:baseline;transform:translateY(.01em)}
.logo-o svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.lo-t{fill:none;stroke:#2b3023;stroke-width:22}
.lo-a{fill:none;stroke:var(--lime);stroke-width:22;stroke-linecap:round;stroke-dasharray:75 100}
@keyframes enche{0%{stroke-dasharray:0 100}70%,100%{stroke-dasharray:75 100}}
@keyframes encheLoop{0%{stroke-dasharray:0 100}45%,85%{stroke-dasharray:75 100}100%{stroke-dasharray:75 100}}
.logo.loop .lo-a{animation:encheLoop 5s cubic-bezier(.3,.8,.2,1) infinite}
.logo.once .lo-a{animation:enche 1.4s cubic-bezier(.3,.8,.2,1) .15s both}
.brandbar{display:flex;justify-content:space-between;align-items:center;padding-top:calc(22px + env(safe-area-inset-top))}
.top.home{padding-top:2px}
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;transition:opacity .45s ease,transform .45s ease}
#splash .logo{font-size:clamp(56px,16vw,96px);animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
#splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
/* conta / nuvem */
.bb-r{display:flex;align-items:center;gap:8px}
.cl-badge{height:40px;padding:0 14px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--lime);display:inline-flex;align-items:center}
.cl-badge.on{width:40px;padding:0;justify-content:center}
.cl-badge .ic{width:20px;height:20px}
.cloud .cl-h{display:flex;align-items:flex-start;gap:12px}
.cloud .cl-h>.ic{width:26px;height:26px;color:var(--lime);flex:none;margin-top:1px}
.cloud .cl-h>div{flex:1;display:flex;flex-direction:column;gap:3px}
.cloud.on{border-color:rgba(214,245,61,.35);background:linear-gradient(135deg,#1c2212,var(--surface))}
.cl-dot{width:10px;height:10px;border-radius:50%;background:var(--lime);flex:none;margin-top:8px}
.cl-dot.sync{animation:fadeIn .6s ease infinite alternate}
.cl-dot.error{background:var(--danger)} .cl-dot.offline{background:var(--muted)}
.cl-st{font-size:13.5px;color:var(--muted)}
.gbtn{background:#fff;color:#1f1f1f;gap:10px;min-height:52px}
.gbtn:hover{box-shadow:0 8px 24px rgba(255,255,255,.12)}
.g-ic{width:26px;height:26px;display:grid;place-items:center;flex:none;background:#fff;border-radius:50%}
.g-ic svg{width:16px;height:16px}
.cl-dot.inl{display:inline-block;width:8px;height:8px;margin:0 8px 1px 0}
.cl-alt{align-self:center;color:var(--muted)}
/* conta */
.avatar{display:grid;place-items:center;border-radius:50%;background:var(--surface2);border:2px solid var(--line);color:var(--lime);font-family:var(--display);font-weight:800;flex:none;position:relative}
.avatar .ic{width:55%;height:55%;color:var(--muted)}
.avatar.linked{border-color:var(--lime);box-shadow:0 0 0 3px rgba(214,245,61,.12)}
.av-btn{border-radius:50%;transition:transform .15s}
.av-btn:hover{transform:scale(1.06)}
.profile .pf-h{display:flex;align-items:center;gap:14px}
.profile .pf-h>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.pf-name{font-family:var(--display);font-size:24px;font-weight:800}
#name-msg.ok{color:var(--lime)}
.pf-form{display:flex;flex-direction:column;gap:12px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>span{font-size:12.5px;font-weight:700;color:var(--muted)}
.fld input{background:var(--surface2);border:1px solid var(--line);color:var(--ink);font:600 16px var(--body);padding:12px 14px;border-radius:14px;width:100%;box-sizing:border-box}
.pf-goal button{white-space:nowrap;font-size:13.5px;padding:10px 6px}
.fld-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.back-link{padding-top:calc(20px + env(safe-area-inset-top));align-self:flex-start}
.top.acc-top{padding-top:0}
.acc-link,.name-cta{flex-direction:row;align-items:center;gap:14px;text-align:left}
.acc-link>div,.name-cta>div{flex:1;display:flex;flex-direction:column;min-width:0}
.acc-link small,.name-cta small{color:var(--muted);font-size:13px}
.name-cta{border-color:rgba(214,245,61,.3);background:linear-gradient(135deg,#1c2212,var(--surface))}
.card .goal{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:6px}
.card .goal b{display:block}
.cl-code{letter-spacing:.4em;font-variant-numeric:tabular-nums;text-align:center}
.cl-msg{font-size:13.5px;color:var(--danger)}
.cloud .inline input{min-width:0}
.today .row-btns{display:grid;grid-template-columns:1.25fr 1fr;gap:10px;width:100%;margin-top:4px}
.today .row-btns .btn{width:100%;min-height:52px;padding:12px 16px;white-space:nowrap}
.today .row-btns .btn.ghost{background:rgba(255,255,255,.04);border-color:#353b2b}
.today .row-btns .btn.ghost:hover{border-color:var(--lime);color:var(--lime)}
.today .row-btns .btn.ghost .ic{width:16px;height:16px;transition:transform .2s}
.today .row-btns .btn.ghost:hover .ic{transform:translateX(3px)}
/* barra de scroll (computador) */
@media (hover:hover) and (pointer:fine){
  ::-webkit-scrollbar{width:12px;height:12px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#2f3527;border-radius:99px;border:3px solid var(--bg);min-height:48px;transition:background .2s}
  ::-webkit-scrollbar-thumb:hover{background:var(--lime)}
  ::-webkit-scrollbar-thumb:active{background:#eaff8a}
  ::-webkit-scrollbar-corner{background:transparent}
  .modal-in::-webkit-scrollbar-thumb{border-color:var(--surface)}
  .hscroll::-webkit-scrollbar,.chipbar::-webkit-scrollbar{height:0}
}
/* Firefox: a barra fina nas cores da app */
@supports not selector(::-webkit-scrollbar){html,.overlay,.modal-in{scrollbar-width:thin;scrollbar-color:#3a4130 transparent}}
/* explorar */
.ex-top{align-items:flex-end}
.mode.compact{flex:none;padding:4px;border-radius:14px;margin-bottom:4px}
.mode.compact button{padding:8px 12px;font-size:13px;gap:6px;border-radius:10px}
.mode.compact button .ic{width:16px;height:16px}
.mode.compact .mode-ind{top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:10px}
.ex-tools{display:flex;flex-direction:column;gap:14px}
.utabs{display:flex;gap:26px;border-bottom:1px solid var(--line)}
.utabs button{position:relative;padding:10px 0 12px;font-weight:700;font-size:16px;color:var(--muted);display:flex;align-items:center;gap:8px;transition:color .2s}
.utabs button i{font-style:normal;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.utabs button::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--lime);transform:scaleX(0);transition:transform .3s cubic-bezier(.3,1.3,.5,1)}
.utabs button.on{color:var(--ink)}
.utabs button.on::after{transform:scaleX(1)}
.utabs button.on i{background:var(--lime);color:var(--lime-ink)}
.utabs button:hover{color:var(--ink)}
.chipwrap{position:relative;margin:0 -16px}

<script>
/* ===== Motor de animação dos bonecos ===== */
const FLOOR = 166, SW = 4;           // chão e meia-espessura do traço
const BN = { T: 44, N: 15, R: 10, UA: 24, FA: 22, TH: 32, SH: 32 };
const D2R = Math.PI / 180;
const dir = a => [Math.sin(a * D2R), Math.cos(a * D2R)];
const ang = (x, y) => Math.atan2(x, y) / D2R;
const lerp = (a, b, t) => a + (b - a) * t;
const lerpA = (a, b, t) => a + ((((b - a) % 360) + 540) % 360 - 180) * t;
const G = FLOOR - SW;

function ik(root, tg, L1, L2, k) {
  const dx = tg[0] - root[0], dy = tg[1] - root[1];
  let d = Math.hypot(dx, dy);
  d = Math.min(Math.max(d, Math.abs(L1 - L2) + .01), L1 + L2 - .01);
  const c = (L1 * L1 + d * d - L2 * L2) / (2 * L1 * d);
  const a1 = ang(dx, dy) + k * Math.acos(Math.max(-1, Math.min(1, c))) / D2R;
  const e = [root[0] + L1 * Math.sin(a1 * D2R), root[1] + L1 * Math.cos(a1 * D2R)];
  const a2 = ang(tg[0] - e[0], tg[1] - e[1]);
  return [e, [e[0] + L2 * Math.sin(a2 * D2R), e[1] + L2 * Math.cos(a2 * D2R)]];
}

function mixPose(A, B, s) {
  const o = { t: lerpA(A.t, B.t, s), h: lerpA(A.h ?? A.t, B.h ?? B.t, s), lift: lerp(A.lift || 0, B.lift || 0, s), sx: lerp(A.sx || 0, B.sx || 0, s) };
  for (const k of ['a1', 'a2', 'l1', 'l2']) {
    const p = A[k], q = B[k];
    o[k] = Array.isArray(p) ? [lerpA(p[0], q[0], s), lerpA(p[1], q[1], s)]
      : { w: [lerp(p.w[0], q.w[0], s), lerp(p.w[1], q.w[1], s)], k: p.k };
  }
  return o;
}

const LIMBS = [['a1', 'sh1', 'e1', 'w1', 'UA', 'FA'], ['a2', 'sh2', 'e2', 'w2', 'UA', 'FA'],
               ['l1', 'hp1', 'k1', 'f1', 'TH', 'SH'], ['l2', 'hp2', 'k2', 'f2', 'TH', 'SH']];

function solve(ex, P) {
  const front = ex.view === 'front';
  const td = dir(P.t), pp = [-td[1], td[0]];
  const p = { hip: [0, 0] };
  p.neck = [td[0] * BN.T, td[1] * BN.T];
  const so = front ? 12 : 0, ho = front ? 7 : 0;
  p.sh1 = [p.neck[0] + pp[0] * so, p.neck[1] + pp[1] * so + (front ? 3 : 0)];
  p.sh2 = [p.neck[0] - pp[0] * so, p.neck[1] - pp[1] * so + (front ? 3 : 0)];
  p.hp1 = [pp[0] * ho, pp[1] * ho]; p.hp2 = [-pp[0] * ho, -pp[1] * ho];
  const hd = dir(P.h); p.head = [p.neck[0] + hd[0] * BN.N, p.neck[1] + hd[1] * BN.N];
  const fkNames = ['hip', 'neck'];
  for (const [k, r, m, e, L1, L2] of LIMBS) {
    const lim = P[k]; if (!Array.isArray(lim)) continue;
    const u = dir(lim[0]), l = dir(lim[1]);
    p[m] = [p[r][0] + u[0] * BN[L1], p[r][1] + u[1] * BN[L1]];
    p[e] = [p[m][0] + l[0] * BN[L2], p[m][1] + l[1] * BN[L2]];
    fkNames.push(m, e);
  }
  if (ex.fixHip) { var dx = ex.fixHip[0] + (P.sx || 0), dy = ex.fixHip[1] - (P.lift || 0); }
  else {
    const cand = ex.ground || fkNames.concat('head');
    let maxY = -1e9;
    for (const n of cand) { if (!p[n]) continue; const y = n === 'head' ? p.head[1] + BN.R - SW : p[n][1]; if (y > maxY) maxY = y; }
    var dy = G - (ex.gy || 0) - (P.lift || 0) - maxY;
    const an = p[ex.anchor || 'hip'];
    var dx = (ex.ax ?? 120) - an[0];
  }
  for (const n in p) p[n] = [p[n][0] + dx, p[n][1] + dy];
  for (const [k, r, m, e, L1, L2] of LIMBS) {
    const lim = P[k]; if (Array.isArray(lim)) continue;
    const [mm, ee] = ik(p[r], lim.w, BN[L1], BN[L2], lim.k); p[m] = mm; p[e] = ee;
  }
  return p;
}

const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent) { const n = document.createElementNS(NS, tag); for (const a in attrs) n.setAttribute(a, attrs[a]); parent && parent.appendChild(n); return n; }

/* Cria um boneco animado dentro de um contentor */
function makeFigure(container, exId, opts = {}) {
  const ex = EX[exId]; if (!ex) return null;
  const svg = el('svg', { viewBox: '0 0 240 180', class: 'fig', 'aria-label': 'Animação: ' + ex.name, role: 'img' });
  // chão
  el('line', { x1: -200, x2: 440, y1: FLOOR, y2: FLOOR, class: 'f-floor' }, svg);
  const shadow = el('ellipse', { cx: 120, cy: FLOOR + 2, rx: 40, ry: 3, class: 'f-shadow' }, svg);
  for (const pr of ex.props || []) {
    if (pr.type === 'box') el('rect', { x: pr.x, y: FLOOR - pr.h, width: pr.w, height: pr.h, rx: 3, class: 'f-prop' }, svg);

/* junta o progresso de dois aparelhos sem perder nada */
function hKey(h) { return h.id || [h.d, h.w, h.min, h.h ?? '', h.lv || h.lvl || ''].join('|'); }
function mergeStates(a, b) {
  const newer = (a._t || 0) >= (b._t || 0) ? a : b, older = newer === a ? b : a;
  const out = Object.assign({}, older, newer);
  const hist = new Map(); [...(older.history || []), ...(newer.history || [])].forEach(h => hist.set(hKey(h), h));
  out.history = [...hist.values()].sort((x, y) => (x.d + (x.h ?? 0)).localeCompare(y.d + (y.h ?? 0)));
  const w = new Map(); [...(older.weights || []), ...(newer.weights || [])].forEach(x => w.set(x.d, x));
  out.weights = [...w.values()].sort((x, y) => x.d.localeCompare(y.d));
  out.unlocked = [...new Set([...(a.unlocked || []), ...(b.unlocked || [])])];
  out.loads = Object.assign({}, older.loads || {}, newer.loads || {});
  out.best = {}; for (const s of [a.best || {}, b.best || {}]) for (const k in s) out.best[k] = Math.max(out.best[k] || 0, s[k]);
  out.prs = Math.max(a.prs || 0, b.prs || 0);
  // perfil e definições: vence a alteração mais recente de cada campo (a = nuvem, b = este aparelho)
  const fa = a._f || {}, fb = b._f || {}, empty = v => v === undefined || v === null || v === '';
  out._f = {};
  FIELDS.forEach(k => {
    const ta = fa[k] || 0, tb = fb[k] || 0;
    let v;
    if (ta || tb) v = tb > ta ? b[k] : a[k];
    else v = empty(a[k]) ? b[k] : a[k];          // sem registo de alteração: nunca trocar um valor real por um vazio
    if (empty(v)) v = empty(a[k]) ? b[k] : a[k];
    out[k] = v; out._f[k] = Math.max(ta, tb);
  });
  const mx = (p, q) => { const r = Object.assign({}, p); for (const k in q) r[k] = Math.max(r[k] || 0, q[k]); return r; };
  out.totals = { reps: mx((a.totals || {}).reps || {}, (b.totals || {}).reps || {}), sec: mx((a.totals || {}).sec || {}, (b.totals || {}).sec || {}) };
  return out;
}
function cloudPayload() { const o = Object.assign({}, S); LOCAL_ONLY.forEach(k => delete o[k]); delete o._dirty; return o; }

async function pullMerge() {
  if (!CL.sb || !CL.user || CL.busy) return; CL.busy = true; CL.status = 'sync'; refreshCloudUI();
  try {
    const { data, error } = await CL.sb.from('user_state').select('state, updated_at').eq('user_id', CL.user.id).maybeSingle();
    if (error) throw error;
    if (data && data.state) {
      const keep = {}; LOCAL_ONLY.forEach(k => { if (k in S) keep[k] = S[k]; });
      const merged = mergeStates(data.state, S);
      Object.keys(S).forEach(k => delete S[k]); Object.assign(S, merged, keep); snapFields();
      S.totals = S.totals || { reps: {}, sec: {} }; S.unlocked = S.unlocked || []; S.loads = S.loads || {}; S.best = S.best || {};
      try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
    }
    CL.busy = false; await pushNow(true);
    if ($('#main') && $('#player').hidden) render();
  } catch (e) { CL.status = 'error'; CL.busy = false; refreshCloudUI(); }
}
function cloudQueue() {
  S._dirty = true;
  if (!CL.user) return;
  clearTimeout(CL.timer); CL.timer = setTimeout(pushNow, 1500);
}
async function pushNow(force) {
  if (!CL.sb || !CL.user || (CL.busy && !force)) return;
  if (!navigator.onLine) { CL.status = 'offline'; refreshCloudUI(); return; }
  CL.busy = true; CL.status = 'sync'; refreshCloudUI();
  try {
    const { error } = await CL.sb.from('user_state').upsert({ user_id: CL.user.id, state: cloudPayload(), updated_at: new Date().toISOString() });
    if (error) throw error;
    S._dirty = false; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
    CL.status = 'ok'; CL.lastSync = new Date();
  } catch (e) { CL.status = 'error'; }
  CL.busy = false; refreshCloudUI();
}

/* login com código por email */
async function sendCode(email) {
  CL.msg = ''; CL.email = email.trim().toLowerCase();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(CL.email)) { CL.msg = 'Escreve um email válido.'; return refreshCloudUI(); }
  CL.status = 'sending'; refreshCloudUI();
  const { error } = await CL.sb.auth.signInWithOtp({ email: CL.email, options: { shouldCreateUser: true } });
  CL.status = 'idle';
  if (error) {
    CL.msg = /rate|seconds/i.test(error.message) ? 'Pediste um código há pouco. Espera um minuto e tenta outra vez.'
      : /not authorized|not_authorized/i.test(error.message + (error.code || '')) ? 'Este email ainda não pode receber códigos. O dono da app tem de ativar o envio de emails.'
      : 'Não foi possível enviar o código. Tenta outra vez.';
  } else { CL.step = 'code'; CL.msg = ''; }
  refreshCloudUI();
  if (CL.step === 'code') setTimeout(() => { const i = $('#cl-code'); if (i) i.focus(); }, 50);
}
async function verifyCode(code) {
  if (CL.status === 'sending') return;
  CL.msg = ''; code = code.replace(/\D/g, '');
  if (code.length < 6) { CL.msg = 'O código tem 6 dígitos.'; return refreshCloudUI(); }
  CL.status = 'sending'; refreshCloudUI();
  const { data, error } = await CL.sb.auth.verifyOtp({ email: CL.email, token: code, type: 'email' });
  CL.status = 'idle';
  if (error) { CL.msg = 'Código errado ou expirado. Confirma o email ou pede um novo.'; return refreshCloudUI(); }
  CL.user = data.user; CL.step = 'email'; await pullMerge();
}
const isAnon = () => !!(CL.user && CL.user.is_anonymous);
const redirectURL = () => location.origin + location.pathname;
async function googleLink() {
  CL.msg = ''; CL.status = 'sending'; refreshCloudUI();
  if (S._dirty) await pushNow(true);
  const r = isAnon() ? await CL.sb.auth.linkIdentity({ provider: 'google', options: { redirectTo: redirectURL() } })
                     : await CL.sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: redirectURL() } });
  if (r.error) { if (isAnon()) return googleSignIn(); CL.status = 'idle'; CL.msg = 'Não foi possível abrir o Google. Tenta outra vez.'; refreshCloudUI(); }
}
async function googleSignIn() {
  const r = await CL.sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: redirectURL(), queryParams: { prompt: 'select_account' } } });
  if (r.error) { CL.status = 'idle'; CL.msg = 'Não foi possível abrir o Google. Tenta outra vez.'; refreshCloudUI(); }
}
async function signOut() {
  if (S._dirty) await pushNow(true);
  try { await CL.sb.auth.signOut(); } catch (e) {}
  CL.user = null; CL.status = 'idle'; CL.step = 'email'; CL.showEmail = false; CL.lastSync = null;
  // limpa os dados da conta neste aparelho (ficam guardados na nuvem); mantém só as preferências do aparelho
  const keep = {}; LOCAL_ONLY.forEach(k => { if (k in S) keep[k] = S[k]; });
  Object.keys(S).forEach(k => delete S[k]); Object.assign(S, DEF_S(), keep); snapFields();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  const r = await CL.sb.auth.signInAnonymously(); if (!r.error) CL.user = r.data.user;
  render(true);
}

const lvl = () => LEVELS.find(l => l.id === S.level) || LEVELS[1];
function scaled(item, L) {
  const [ex, mode, amt, side, sets] = item;
  if (sets) return { ex, mode, amt, side, sets: Math.max(2, sets + L.dr) };
  if (amt === 'MÁX') return { ex, mode, amt, side };
  let v = amt * L.k;
  v = mode === 't' ? Math.round(v / 5) * 5 : Math.round(v);
  return { ex, mode, amt: Math.max(mode === 't' ? 15 : 5, v), side };
}
function plan(w, L = lvl()) {
  const rounds = Math.max(1, w.rounds + L.dr), rest = Math.round(w.rest * L.rk / 5) * 5, rr = Math.round(w.roundRest * L.rk / 5) * 5;
  const items = w.items.map(i => scaled(i, L));
  let sec = 0;
  if (w.mode === 'sets') {
    items.forEach(i => sec += i.sets * ((i.amt === 'MÁX' ? 10 : i.amt) * 3.5 * (i.side ? 2 : 1)) + (i.sets - 1) * rest);
    sec += rr * (items.length - 1);
  } else {
  items.forEach(i => sec += (i.mode === 't' ? i.amt : (i.amt === 'MÁX' ? 15 : i.amt) * 3.2) * (i.side ? 2 : 1));
  sec = sec * rounds + rest * (items.length - 1) * rounds + rr * (rounds - 1);

  const extras = w.id === 'mobility' ? 0 : (S.warm ? WARMUP.reduce((s, x) => s + x[1], 0) : 0) + (S.cool ? COOLDOWN.reduce((s, x) => s + x[1], 0) : 0);

  const sets = items.reduce((s, i) => s + (i.sets || rounds), 0);
  return { rounds: w.mode === 'sets' ? 1 : rounds, rest, rr, items, min, kcal: Math.round(min * w.rate), sets, gym: w.mode === 'sets' };
}

function sparkline(W) {
  const w = 300, h = 90, ks = W.map(x => x.kg), mn = Math.min(...ks) - .5, mx = Math.max(...ks) + .5;
  const X = i => 8 + i * (w - 16) / (W.length - 1), Y = v => h - 14 - (v - mn) / (mx - mn) * (h - 28);
  const pts = W.map((x, i) => `${X(i).toFixed(1)},${Y(x.kg).toFixed(1)}`).join(' ');
  const last = W[W.length - 1], diff = (last.kg - W[0].kg);
  return `<div class="spark-h"><b>${last.kg.toLocaleString('pt-PT')} kg</b><span class="${diff >= 0 ? 'up' : 'down'}">${diff >= 0 ? '+' : ''}${diff.toFixed(1).replace('.', ',')} kg desde ${new Date(W[0].d + 'T12:00').toLocaleDateString('pt-PT', { day: 'numeric', month: 'short' })}</span></div>
  <svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><line x1="0" x2="${w}" y1="${h - 14}" y2="${h - 14}" class="grid"/>
  <polygon points="8,${h - 14} ${pts} ${X(W.length - 1)},${h - 14}" class="area"/><polyline points="${pts}" class="lineg"/>
  <circle cx="${X(W.length - 1)}" cy="${Y(last.kg)}" r="4" class="dot"/></svg>`;
}

let PL = null, AC = null, wakeLock = null;
function beep(f = 880, d = .12, v = .25) {
  if (!S.sound) return;
  try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const o = AC.createOscillator(), g = AC.createGain();
    o.frequency.value = f; o.type = 'sine'; g.gain.setValueAtTime(v, AC.currentTime); g.gain.exponentialRampToValueAtTime(.001, AC.currentTime + d);
    o.connect(g).connect(AC.destination); o.start(); o.stop(AC.currentTime + d); } catch (e) {}
}
// Som de fim de exercício: 3 notas a subir + vibração (diferente dos bips de contagem)
function tone(f, at, d, v, type) {
  const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(.0001, at); g.gain.exponentialRampToValueAtTime(v, at + .015); g.gain.exponentialRampToValueAtTime(.0001, at + d);
  o.connect(g).connect(AC.destination); o.start(at); o.stop(at + d + .02);
}
function endChime() {
  try { navigator.vibrate && navigator.vibrate([220, 90, 220, 90, 400]); } catch (e) {}
  if (!S.sound) return;
  try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const t = AC.currentTime + .02;
    [[784, 0], [988, .13], [1318, .26]].forEach(([f, dt]) => { tone(f, t + dt, .22, .32, 'triangle'); tone(f * 2, t + dt, .18, .06, 'sine'); });
    tone(1568, t + .42, .7, .3, 'triangle'); tone(1975, t + .42, .7, .08, 'sine');
  } catch (e) {}
  if (PL) PL.chimeAt = performance.now();
}
/* Tempo-limite para exercícios por repetições */
const FAST = ['burpee', 'jumpsquat', 'jacks', 'highknees', 'climbers', 'calf', 'crunch'];
function repTime(s) {
  if (s.amt === 'MÁX') return EX[s.ex].place === 'gym' ? 45 : 50;
  const per = FAST.includes(s.ex) ? 2 : EX[s.ex].place === 'gym' ? 4 : 3;
  return Math.max(20, Math.ceil(s.amt * per * (s.side ? 2 : 1) / 5) * 5);
}
/* ===== Voz do treinador ===== */
let VOICES = [];
function scoreVoice(v) {
  const n = v.name.toLowerCase(), l = (v.lang || '').toLowerCase().replace('_', '-');
  let s = 0;
  if (l === 'pt-pt') s += 60; else if (l.startsWith('pt')) s += 25; else return -999;
  if (/natural|neural|online/.test(n)) s += 45;
  if (/premium|enhanced|melhorad|aprimorad|siri/.test(n)) s += 40;
  if (/google/.test(n)) s += 20;
  if (/espeak|compact|robot/.test(n)) s -= 50;
  if (!v.localService) s += 5;
  return s;
}

}

/* ===== Eventos ===== */
document.addEventListener('click', ev => {
  const t = ev.target.closest('button, [data-ex]'); if (!t) { if (ev.target.id === 'modal') closeEx(); return; }
  const d = t.dataset;
  if (d.go) return go(d.go);
  if (d.mode) { if (S.mode !== d.mode) { S.mode = d.mode; planEdit = false; PDRAFT = null; save(); render(true); } return; }
  if (d.open) return openWorkout(d.open);
  if (d.start) return startWorkout(d.start);
  if (d.ex) return openEx(d.ex);
  if (d.exinfo) { if (PL) PL.paused = true; drawPlayer(); return openEx(d.exinfo); }
  if (d.cat !== undefined) { filterCat = d.cat; libTab = 'treinos'; return go('treinos'); }
  if (d.filter) { filterCat = d.filter; return render(true); }
  if (d.tab) { libTab = d.tab; return render(true); }
  if ('medals' in d) {
    medalsOpen = !medalsOpen; const sec = t.closest('.medals'); sec.classList.toggle('open', medalsOpen);
    t.setAttribute('aria-expanded', medalsOpen); sec.querySelector('.ach-more').setAttribute('aria-hidden', !medalsOpen);
    const n = sec.querySelectorAll('.ach-more .ach').length;
    t.innerHTML = (medalsOpen ? 'Mostrar menos' : `Ver todas as medalhas <span class="mt-n">+${n}</span>`) + '<svg class="ic mchev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
    if (!medalsOpen) sec.scrollIntoView({ behavior: RM ? 'auto' : 'smooth', block: 'start' });
    return;
  }
  if (d.delbest) { const id = d.delbest; return confirmBox({ title: 'Apagar a carga guardada?', text: `A última carga e o recorde de ${EX[id].name} voltam a ficar vazios. Útil se ficou registado um valor errado.`, yes: 'Apagar', no: 'Cancelar', icon: 'trash', danger: true, onYes: () => { delete S.loads[id]; delete S.best[id]; save(); closeEx(); render(); } }); }
  if ('settings' in d) return openSettings();
  if ('ptest' in d) { const m = $('#remind-msg'); if (m) { m.textContent = 'A enviar…'; m.className = 'rm-msg'; } testPush().then(ok => { const mm = $('#remind-msg'); if (mm) { mm.textContent = ok ? 'Enviada. Deve aparecer daqui a uns segundos.' : 'Não foi possível enviar o teste.'; mm.className = 'rm-msg ' + (ok ? 'ok' : 'err'); } }); return; }
  if ('planedit' in d) return startPlanEdit();
  if ('pcancel' in d) { planEdit = false; PDRAFT = null; return render(true); }
  if ('psave' in d) { S.plans = Object.assign({}, S.plans || {}); const o = {}; PLAN_ORDER.forEach((day, i) => o[day] = { w: PDRAFT[i].w, extra: PDRAFT[i].extra }); S.plans[S.mode] = o; save(); planEdit = false; PDRAFT = null; render(true); return; }
  if ('preset' in d) return confirmBox({ title: 'Repor o plano original?', text: 'O teu plano personalizado deste modo é apagado e volta o plano sugerido pela app.', yes: 'Repor', no: 'Cancelar', icon: 'cal', danger: true, onYes: () => { S.plans = Object.assign({}, S.plans || {}); delete S.plans[S.mode]; save(); planEdit = false; PDRAFT = null; render(true); } });
  if (d.pick) return planPicker(+d.pick);
  if (d.pmove) { const [i, s] = d.pmove.split(':').map(Number); movePlan(i, i + s); return redrawEditor(); }
  if (d.pset !== undefined) { const [i, id] = d.pset.split(':'); PDRAFT[+i].w = id || null; if (!id) PDRAFT[+i].extra = null; closeEx(); return redrawEditor(); }
  if (d.pnoextra) { PDRAFT[+d.pnoextra].extra = null; closeEx(); return redrawEditor(); }
  if (d.aim) { PL_AIM = d.aim; document.querySelectorAll('.pf-goal button').forEach(b => { const on = b.dataset.aim === d.aim; b.classList.toggle('on', on); b.setAttribute('aria-checked', on); }); return; }
  if (d.level) { S.level = d.level; save(); return $('#sheet').hidden ? render() : $('#sheet')._redraw(); }
  if ('close' in d) return closeSheet();
  if (d.vpick !== undefined || d.vprev !== undefined) {
    const name = d.vpick ?? d.vprev, prevSel = S.voiceName;
    if (d.vpick !== undefined) {
      S.voiceName = name; save();
      document.querySelectorAll('.vrow').forEach(r => { const b = r.querySelector('.vpick'), on = b.dataset.vpick === name; r.classList.toggle('on', on); b.setAttribute('aria-checked', on); });
    } else S.voiceName = name;
    document.querySelectorAll('.vprev').forEach(b => b.classList.toggle('playing', b.dataset.vprev === name));
    say(pick(['Olá! Sou o teu treinador. Bora treinar!', 'Flexões, quinze repetições. Força!', 'Última série, dá tudo!']), true);
    if (d.vpick === undefined) S.voiceName = prevSel;
    setTimeout(() => document.querySelectorAll('.vprev.playing').forEach(b => b.classList.remove('playing')), 2200);
    return;
  }
  if ('mclose' in d) return closeEx();
  if (d.goal) { S.goal = Math.min(7, Math.max(1, S.goal + +d.goal)); save(); return render(); }
  if (t.id === 'clear') return confirmBox({ title: 'Apagar o histórico?', text: `Vais perder ${S.history.length === 1 ? 'o treino registado' : 'os ' + S.history.length + ' treinos registados'}. As medalhas já conquistadas mantêm-se. Isto não dá para desfazer.`, yes: 'Apagar tudo', no: 'Manter', icon: 'trash', danger: true, onYes: () => { S.history = []; save(); render(true); } });
  if ('cno' in d) { const c = $('#confirm'), fn = c._no; c._no = null; return animClose(c, 'modal-close', () => { c.hidden = true; fn && fn(); }); }
  if ('cyes' in d) { const c = $('#confirm'); c.hidden = true; c._yes && c._yes(); return; }
  // player
  if ('quit' in d) {
    if (PL) { PL.wasPaused = PL.paused; PL.paused = true; }
    const tot = PL ? PL.steps.filter(x => x.k === 'work').length : 0, dn = PL ? PL.steps.slice(0, PL.idx).filter(x => x.k === 'work').length : 0;
    return confirmBox({ title: 'Desistir já?', text: 'Se saíres agora, este treino não conta para o histórico nem para as medalhas.', yes: 'Continuar a treinar', no: 'Sair do treino', icon: 'fire',
      progress: tot ? dn / tot : null, progLabel: `${dn} de ${tot} exercícios feitos`, onYes: () => { if (PL) PL.paused = !!PL.wasPaused; }, onNo: quitPlayer });
  }
  if ('endclose' in d) return quitPlayer();
  if (!PL) return;
  if ('skipphase' in d) { const ph = (PL.steps[PL.idx].phase) || (PL.steps[nextWorkIdx(PL.idx)] || {}).phase;
    if (ph === 'cool') return finish();
    const j = PL.steps.findIndex(x => x.main); return enter(j > 0 ? j : PL.idx + 1); }
  if (d.load) { const s = PL.steps[PL.idx]; const v = Math.max(0, (curLoad(s.ex) ?? 0) + +d.load * loadStep(s.ex)); PL.loads[s.ex] = v || null; const n = $('#ld-val'); if (n) { n.value = v ? kg(v) : ''; if (!RM) { n.classList.remove('tick'); void n.offsetWidth; n.classList.add('tick'); } } return; }
  if ('skip' in d) { PL.steps[PL.idx].counted = 1; return enter(PL.idx + 1); }
  if ('next' in d) { const s = PL.steps[PL.idx]; if (s.k === 'work') endChime(); commitLoad(); return enter(PL.idx + 1); }
  if ('prev' in d) { let i = PL.idx - 1; while (i > 0 && PL.steps[i].k !== 'work') i--; return enter(Math.max(1, i)); }
  if ('pause' in d) { PL.paused = !PL.paused; return drawPlayer(); }
  if ('add' in d) { PL.left += 15; PL.steps[PL.idx].dur += 15; return updT(); }
  if ('sound' in d) { S.sound = !S.sound; save(); return drawPlayer(); }
  if ('voice' in d) { S.voice = !S.voice; save(); if (!S.voice) try { speechSynthesis.cancel(); } catch (e) {} return drawPlayer(); }
});
document.addEventListener('submit', ev => {
  ev.preventDefault();
  if (ev.target.id === 'name-f') {
    const v = $('#name-in').value.trim().split(/\s+/)[0] || '';
    S.name = v ? v.charAt(0).toUpperCase() + v.slice(1) : '';
    const kg = parseFloat(($('#pf-kg').value || '').replace(',', '.')), cm = parseInt($('#pf-cm').value, 10);
    const last = S.weights.length ? S.weights[S.weights.length - 1].kg : null;
    if (kg >= 30 && kg <= 200 && Math.round(kg * 10) / 10 !== last) { const k = today(); S.weights = S.weights.filter(w => w.d !== k); S.weights.push({ d: k, kg: Math.round(kg * 10) / 10 }); }
    S.height = cm >= 120 && cm <= 230 ? cm : (S.height || null);
    S.aim = PL_AIM || S.aim || 'massa';
    save(); render();
    const m = $('#name-msg'); if (m) { m.innerHTML = `Perfil guardado${S.name ? `, <b>${esc(S.name)}</b>` : ''}.`; m.classList.add('ok'); }
    return;
  }
});
document.addEventListener('change', ev => {
  if (ev.target.id === 'tg-remind') {
    const on = ev.target.checked; S.remind = Object.assign({ time: '18:00' }, S.remind || {});
    if (!on) { S.remind.on = false; save(); disablePush(); return redrawRemind('Lembretes desligados.', true); }
    const m = $('#remind-msg'); if (m) m.textContent = 'A ativar…';
    enablePush().then(res => {
      if (res === 'on') { S.remind.on = true; save(); redrawRemind(`Feito. Vais receber um lembrete às ${S.remind.time} nos dias de treino.`, true); }
      else { S.remind.on = false; save(); redrawRemind(res === 'denied' ? 'Não deste permissão para notificações. Ativa-as nas definições do aparelho.' : 'Não foi possível ativar. Tenta outra vez com internet.', false); }
    });
    return;
  }
  if (ev.target.id === 'remind-time') { S.remind = Object.assign({}, S.remind || {}, { time: ev.target.value || '18:00' }); save(); const m = $('#remind-msg'); if (m) { m.textContent = `Lembrete às ${S.remind.time}.`; m.className = 'rm-msg ok'; } return; }
  const TG = { 'tg-warm': 'warm', 'tg-cool': 'cool', 'tg-sound': 'sound', 'tg-voice': 'voice' };
  if (TG[ev.target.id]) { S[TG[ev.target.id]] = ev.target.checked; save(); const sh = $('#sheet'); if (!sh.hidden && sh._redraw) { const y = sh.scrollTop; sh._redraw(); sh.scrollTop = y; } return; }
});
document.addEventListener('input', ev => {
  if (ev.target.id === 'ld-val' && PL) { const s = PL.steps[PL.idx]; const v = parseFloat(ev.target.value.replace(',', '.')); PL.loads[s.ex] = v > 0 && v < 1000 ? Math.round(v * 10) / 10 : null; return; } if (ev.target.id === 'ckg') calc(); });
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Escape') return;
  if (!$('#confirm').hidden) { const c = $('#confirm'); c.hidden = true; if (c._no && c._yes && PL) c._yes(); } else if (!$('#modal').hidden) closeEx(); else if (!$('#sheet').hidden) closeSheet();
});

render(true);
// ecrã de abertura
(function () {
  const sp = document.getElementById('splash'); if (!sp) return;
  if (RM) { sp.remove(); return; }
  sp.innerHTML = logo('once');
  setTimeout(() => sp.classList.add('out'), 1700);
  setTimeout(() => sp.remove(), 2200);
})();

document.getElementById('fab').addEventListener('click', () => startWorkout(planDay(new Date().getDay()).w));
</script>
